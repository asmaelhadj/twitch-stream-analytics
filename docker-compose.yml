version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - app_network
    healthcheck:
      test: echo srvr | nc zookeeper 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

  twitch-stream-producer:
    build: ./twitch-producer
    container_name: twitch-stream-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TWITCH_CLIENT_ID: 1puynoltng0hhv2fx4hfnypp996zbd
      TWITCH_OAUTH_TOKEN: wtydsro0kz2v6jkmnxfh1skmx3o2zv
      KAFKA_BROKER: kafka:9092
      TOPIC_NAME: twitch_streams
    restart: on-failure:3
    networks:
      - app_network

  twitch-chat-producer:
    build: ./twitch-chat-producer
    container_name: twitch-chat-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      TOPIC_NAME: twitch_chat
      IRC_CHANNELS: "summit1g,shroud,ninja,xqcow,pokimane"
    restart: on-failure:3
    networks:
      - app_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    networks:
      - app_network

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    hostname: namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hdfs-namenode:/hadoop/dfs/name
    networks:
      - app_network
      - hadoop_net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - hdfs-datanode:/hadoop/dfs/data
    networks:
      - app_network
      - hadoop_net

  spark-master:
    image: bitnami/spark:3.4
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - app_network

  spark-worker:
    image: bitnami/spark:3.4
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=6G
      - SPARK_WORKER_CORES=4
    ports:
      - "8081:8081"
    networks:
      - app_network

  spark-worker-2:
    image: bitnami/spark:3.4
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=2
    ports:
      - "8082:8081"
    networks:
      - app_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.14
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.14
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - elasticsearch
    networks:
      - app_network

  spark-streams-processor:
    build: ./spark
    container_name: spark-streams-processor
    environment:
      - SPARK_SCRIPT=spark_streams_processor.py
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - app_network

  spark-chat-processor:
    build: ./spark
    container_name: spark-chat-processor
    environment:
      - SPARK_SCRIPT=spark_chat_processor.py
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - app_network

  spark-batch-processor:
    build: ./spark
    container_name: spark-batch-processor
    environment:
      - SPARK_SCRIPT=spark_batch_processor.py
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
    networks:
      - app_network
      - hadoop_net

  spark-kafka-to-hdfs:
    build: ./spark
    container_name: spark-kafka-to-hdfs
    environment:
      - SPARK_SCRIPT=spark_kafka_to_hdfs.py
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
    networks:
      - app_network
      - hadoop_net

volumes:
  hdfs-namenode:
  hdfs-datanode:
  elasticsearch-data:
  grafana-data:

networks:
  app_network:
    driver: bridge
  hadoop_net:
    driver: bridge